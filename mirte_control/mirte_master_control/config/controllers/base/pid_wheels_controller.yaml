/**/mirte_base_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "pid_wheels_controller/front_left_wheel_joint"
    front_right_wheel_command_joint_name: "pid_wheels_controller/front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "pid_wheels_controller/rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "pid_wheels_controller/rear_right_wheel_joint"

/**/pid_wheels_controller:
  ros__parameters:
    type: pid_controller/PidController
    command_interface: velocity

    reference_and_state_interfaces: ["velocity"]

    # reference_and_state_dof_names:
    dof_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - front_right_wheel_joint

    # FIXME(SuperJappie08): Maybe split this so it is easily overwritten
    gains:
      front_left_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      rear_left_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      rear_right_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
      front_right_wheel_joint: {p: 1.0, i: 0.0, d: 0.0, i_clamp_max: 5.0, i_clamp_min: -5.0}
