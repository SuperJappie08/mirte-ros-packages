/**:
  controller_manager:
    ros__parameters:
      update_rate: 10  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mirte_base_controller:
        type: diff_drive_controller/DiffDriveController

  mirte_base_controller:
    ros__parameters:
      # TODO(SuperJappie08): Reconfigure
      left_wheel_names: ["joint_left_wheel"]
      right_wheel_names: ["joint_right_wheel"]

      # NOTE(SuperJappie08): UPDATED
      wheel_separation: 0.128  # meters
      wheel_radius: 0.032  # meters

      # wheel_separation_multiplier: 100.0
      wheel_sepeation_multiplier: 1.0
      left_wheel_radius_multiplier: 1.0
      right_wheel_radius_multiplier: 1.0

      publish_rate: 50.0
      odom_frame_id: odom
      base_frame_id: base_link
      pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

      position_feedback: false
      open_loop: true
      enable_odom_tf: true

      cmd_vel_timeout: 0.5
      #publish_limited_velocity: true
      #velocity_rolling_window_size: 10

      # Velocity and acceleration limits
      # Whenever a min_* is unspecified, default to -max_*
      linear.x.has_acceleration_limits: false
      linear.x.max_velocity: 0.55
      linear.x.min_velocity: -0.55
      linear.x.max_acceleration: 1.0
      linear.x.max_jerk: .NaN # NOTE(SuperJappie08): UPDATED
      linear.x.min_jerk: .NaN # NOTE(SuperJappie08): UPDATED
 
      angular.z.has_acceleration_limits: true
      angular.z.max_velocity: 2.0
      angular.z.min_velocity: -2.0
      angular.z.max_acceleration: 1.0
      angular.z.max_deceleration: -1.0
      angular.z.max_jerk: .NaN # NOTE(SuperJappie08): UPDATED
      angular.z.min_jerk: .NaN # NOTE(SuperJappie08): UPDATED

